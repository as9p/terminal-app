# Ghostty settings for the speed tests. tools/keylat/bin-window.sh passes this file with
# --config-default-files=false, so nothing from Ghostty's own config folder is read.

font-size = 14

# Ghostty sizes its first window in grid cells only, never in points. With its built-in font at
# size 14 a cell is about 8.4 by 18.5 points, so this is about 1280 by 800 points with the title
# bar. Each typing result's "target ... window WxH" line from keylat shows the size it really got.
window-width = 152
window-height = 42

scrollback-limit-lines = 20000

# A test window is never restored on the next start, never asks before closing, and no update
# prompt can cover it.
window-save-state = never
confirm-close-surface = false
auto-update = off
