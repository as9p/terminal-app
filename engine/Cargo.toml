[package]
name = "term-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Terminal screen state, input and drawing shared by every view"

[dependencies]
alacritty_terminal = "0.26"
bitflags = "2"
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }
etagere = "0.2"
memchr = "2"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "23"
unicode-width = "0.2"

[dev-dependencies]
png = "0.18"
pollster = "0.4"
