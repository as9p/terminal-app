[package]
name = "term-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Host process that owns terminal sessions"

[dependencies]
anyhow = "1"
bytes = "1"
crossbeam-channel = "0.5"
dirs = "7.0.0"
futures-util = { version = "0.3.34", features = ["sink"] }
getrandom = "0.4.3"
portable-pty = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uuid = "1"
vt100 = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[[bench]]
name = "parse"
harness = false
