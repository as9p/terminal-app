[package]
name = "terminal-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native window that shows terminals owned by term-host"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7.0.0"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
